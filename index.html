<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SBC - Sniper Business Center</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --blue: #1d4ed8;
      --blue-dark: #1e40af;
      --blue-soft: #eff6ff;
      --green: #16a34a;
      --green-soft: #dcfce7;
      --amber: #d97706;
      --amber-soft: #fef3c7;
      --rose: #e11d48;
      --rose-soft: #ffe4e6;
      --purple: #7c3aed;
      --purple-soft: #f3e8ff;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--ink); min-height: 100vh; padding-bottom: 90px; }

    /* Top Header */
    .topbar {
      position: sticky; top: 0; z-index: 40;
      background: #ffffff; border-bottom: 1px solid var(--line);
      height: 60px; padding: 0 14px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 12px;
      border: 1px solid var(--line); background: #fff;
      display: grid; place-items: center; cursor: pointer;
      color: var(--ink); font-size: 18px;
    }
    .icon-btn:active { transform: scale(0.96); }
    .brand-logo {
      display: flex; align-items: center; gap: 8px;
      font-weight: 800; font-size: 15px; letter-spacing: -0.02em;
      cursor: pointer;
    }
    .brand-badge {
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      color: #fff; font-size: 11px; font-weight: 900;
      padding: 5px 8px; border-radius: 9px;
    }
    .topbar-right { display: flex; align-items: center; gap: 8px; position: relative; }
    .notif-dot {
      position: absolute; top: 6px; right: 6px;
      width: 8px; height: 8px; border-radius: 50%; background: var(--rose);
    }

    /* Container */
    .container { max-width: 520px; margin: 0 auto; padding: 14px; }

    /* Back button on Abonnement */
    .sub-top-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .back-pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--green); color: #fff; font-weight: 700; font-size: 13px;
      border: none; border-radius: 999px; padding: 8px 14px; cursor: pointer;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
    }
    .user-chip {
      font-size: 12px; font-weight: 600; color: var(--muted);
      background: #fff; border: 1px solid var(--line);
      padding: 6px 10px; border-radius: 999px;
    }

    /* Hero */
    .hero-card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 18px 16px;
      box-shadow: var(--shadow); margin-bottom: 14px;
    }
    .hero-title {
      font-size: 21px; line-height: 1.25; font-weight: 850;
      color: var(--ink); margin-bottom: 8px;
    }
    .hero-sub {
      font-size: 13.5px; line-height: 1.5; color: var(--muted);
    }

    /* Currency Toggle */
    .currency-toggle {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      background: #e2e8f0; padding: 4px; border-radius: 14px;
      margin-bottom: 14px;
    }
    .currency-btn {
      border: none; border-radius: 11px; padding: 10px 12px;
      font-weight: 700; font-size: 13px; cursor: pointer;
      background: transparent; color: var(--muted); transition: 0.2s;
    }
    .currency-btn.active {
      background: #ffffff; color: var(--ink);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }

    /* Pack Cards */
    .pack-card {
      background: var(--card); border: 1.5px solid var(--line);
      border-radius: var(--radius); padding: 16px;
      box-shadow: var(--shadow); margin-bottom: 14px;
      position: relative;
    }
    .pack-card.featured { border-color: #3b82f6; }
    .pack-card.vip { border-color: #8b5cf6; }
    .pack-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .pack-name { font-size: 17px; font-weight: 800; }
    .pack-tag {
      font-size: 11px; font-weight: 700; padding: 4px 10px;
      border-radius: 999px; background: var(--blue-soft); color: var(--blue);
    }
    .pack-tag.vip { background: var(--purple-soft); color: var(--purple); }
    .pack-price {
      font-size: 24px; font-weight: 900; color: var(--ink);
      margin-bottom: 4px;
    }
    .pack-rate {
      font-size: 13px; font-weight: 700; color: var(--green);
      margin-bottom: 12px;
    }
    .pack-features {
      list-style: none; display: flex; flex-direction: column; gap: 7px;
      margin-bottom: 14px; font-size: 13px; color: #334155;
    }
    .pack-features li::before {
      content: "✓ "; color: var(--green); font-weight: 800;
    }
    .btn-primary {
      width: 100%; border: none; border-radius: 12px;
      padding: 12px 14px; font-weight: 800; font-size: 14px;
      background: var(--blue); color: #fff; cursor: pointer;
    }
    .btn-primary:hover { background: var(--blue-dark); }
    .btn-secondary {
      width: 100%; border: 1px solid var(--line); border-radius: 12px;
      padding: 11px 14px; font-weight: 700; font-size: 13.5px;
      background: #fff; color: var(--ink); cursor: pointer;
    }
    .btn-green {
      width: 100%; border: none; border-radius: 12px;
      padding: 12px 14px; font-weight: 800; font-size: 14px;
      background: var(--green); color: #fff; cursor: pointer;
    }
    .btn-sebpay {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; border: none; border-radius: 12px;
      padding: 13px 14px; font-weight: 850; font-size: 14.5px;
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #fff; text-decoration: none; cursor: pointer;
      box-shadow: 0 6px 16px rgba(22, 163, 74, 0.25);
      margin-bottom: 12px;
    }

    /* Ad card */
    .ad-banner {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff; border-radius: var(--radius); padding: 16px;
      margin-bottom: 16px; box-shadow: var(--shadow);
    }
    .ad-banner h3 { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
    .ad-banner p { font-size: 13px; color: #cbd5e1; margin-bottom: 12px; line-height: 1.45; }

    /* Member Options */
    .section-heading {
      font-size: 16px; font-weight: 850; margin: 16px 0 6px;
    }
    .section-sub {
      font-size: 12.5px; color: var(--muted); margin-bottom: 12px;
    }
    .option-card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 14px; margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .option-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px;
    }
    .option-title { font-weight: 800; font-size: 14.5px; }
    .option-price { font-weight: 800; font-size: 13.5px; color: var(--blue); }
    .option-desc { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; line-height: 1.4; }
    .locked-note {
      font-size: 12px; color: var(--amber); background: var(--amber-soft);
      padding: 8px 10px; border-radius: 10px; font-weight: 600;
    }

    /* Generic Page Cards */
    .page-card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .kpi-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;
    }
    .kpi-box {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; padding: 12px; box-shadow: var(--shadow);
    }
    .kpi-label { font-size: 11.5px; color: var(--muted); font-weight: 600; }
    .kpi-val { font-size: 18px; font-weight: 900; margin-top: 4px; }

    /* Drawer */
    .drawer-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45);
      z-index: 60; display: none;
    }
    .drawer-backdrop.open { display: block; }
    .drawer {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: 82%; max-width: 340px; background: #ffffff;
      z-index: 70; overflow-y: auto; padding: 16px 14px 36px;
      transform: translateX(-100%); transition: transform 0.24s ease;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      margin-bottom: 14px;
    }
    .drawer-title { font-size: 18px; font-weight: 900; }
    .drawer-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .install-card {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: #f8fafc; border: 1px solid var(--line);
      border-radius: 14px; padding: 12px; margin-bottom: 14px;
    }
    .install-left { display: flex; align-items: center; gap: 10px; }
    .install-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--blue-soft); color: var(--blue);
      display: grid; place-items: center; font-weight: 800;
    }
    .install-btn {
      background: var(--blue); color: #fff; border: none;
      border-radius: 10px; padding: 8px 14px; font-weight: 700;
      font-size: 12.5px; cursor: pointer;
    }

    .nav-item {
      width: 100%; border: none; background: transparent;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 10px; border-radius: 12px; cursor: pointer;
      color: var(--ink); font-size: 14px; font-weight: 600; text-align: left;
      margin-bottom: 2px;
    }
    .nav-item:hover { background: #f8fafc; }
    .nav-item.active { background: var(--blue-soft); color: var(--blue); font-weight: 800; }
    .nav-item-left { display: flex; align-items: center; gap: 11px; }
    .nav-badge-icon {
      width: 34px; height: 34px; border-radius: 10px;
      display: grid; place-items: center; font-size: 15px;
      background: #f1f5f9;
    }
    .nav-group-label {
      font-size: 11px; font-weight: 800; letter-spacing: 0.06em;
      color: #64748b; text-transform: uppercase;
      margin: 14px 10px 6px;
    }
    .active-dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--blue);
    }

    /* Floating Help Button */
    .help-fab {
      position: fixed; right: 16px; bottom: 18px; z-index: 45;
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--blue); color: #fff; border: none;
      font-size: 20px; font-weight: 900; cursor: pointer;
      box-shadow: 0 8px 20px rgba(29, 78, 216, 0.35);
    }

    /* Modals */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55);
      z-index: 80; display: none; align-items: center; justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      background: #fff; border-radius: 18px; width: 100%; max-width: 440px;
      padding: 18px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      max-height: 88vh; overflow-y: auto;
    }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; color: #334155; }
    .field input, .field select, .field textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 11px;
      padding: 10px 12px; font-size: 13.5px; color: var(--ink); background: #fff;
    }
    .modal-actions { display: flex; gap: 8px; margin-top: 14px; }

    .toast {
      position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%);
      background: #0f172a; color: #fff; padding: 10px 16px; border-radius: 999px;
      font-size: 12.5px; font-weight: 600; z-index: 100; display: none;
      white-space: nowrap;
    }
    .toast.show { display: block; }
  </style>
</head>

    function generateRefCode(name = "SBC") {
      const clean = name.replace(/[^a-zA-Z]/g, "").toUpperCase().slice(0, 4) || "SBC";
      const num = Math.floor(1000 + Math.random() * 9000);
      return `${clean}${num}`;
    }

    async function ensureUserProfile(user, extra = {}) {
      const ref = doc(db, "users", user.uid);
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        const data = {
          uid: user.uid,
          email: user.email || "",
          fullName: extra.fullName || user.email?.split("@")[0] || "Membre SBC",
          whatsapp: extra.whatsapp || "",
          country: extra.country || "Bénin",
          refCode: generateRefCode(extra.fullName || "SBC"),
          referredBy: extra.referredBy || "",
          pack: null,
          walletBalance: 0,
          activationBalance: 0,
          statusViews: 0,
          createdAt: serverTimestamp()
        };
        await setDoc(ref, data);
        state.profile = data;
      } else {
        state.profile = { id: snap.id, ...snap.data() };
      }
    }

            uid: user.uid,

            "SBC Love",
            "Rencontres, échanges et connexions communautaires SBC.",
            `<div class="page-card"><p style="font-size:13px;color:var(--muted);">Découvrez les profils actifs et initiez des échanges respectueux au sein de la communauté.</p></div>`
          );
          break;
        case "messages":
          html = renderSubPage(
            "Messages",
            "Messagerie et discussions de la plateforme.",
            `<div class="page-card"><p style="font-size:13px;color:var(--muted);">Aucune nouvelle conversation pour le moment. Connectez-vous pour échanger avec vos contacts.</p></div>`
          );
          break;
        case "contacts":
          html = renderSubPage(
            "Contacts",
            "Répertoire et réseau de contacts SBC.",
            `<div class="page-card"><p style="font-size:13px;color:var(--muted);">Développez votre carnet de contacts pour augmenter la portée de vos publications.</p></div>`
          );
          break;
        case "relance":
          html = renderSubPage(
            "Relance",
            "Outils de suivi et relance de vos prospects et filleuls.",
            `<div class="page-card"><p style="font-size:13px;color:var(--muted);">Préparez vos messages de suivi pour accompagner vos filleuls et partenaires.</p></div>`
          );
          break;
        case "portefeuille":
          html = renderSubPage(
            "Portefeuille",
            "Consultez vos soldes et l'historique de vos opérations.",
            `
            <div class="kpi-grid">
              <div class="kpi-box"><div class="kpi-label">Solde disponible</div><div class="kpi-val">${(p.walletBalance || 0).toLocaleString("fr-FR")} FCFA</div></div>
              <div class="kpi-box"><div class="kpi-label">Pack actif</div><div class="kpi-val" style="font-size:14px;">${p.pack || "Aucun"}</div></div>
            </div>
            `
          );
          break;
        case "solde-activation":
          html = renderSubPage(
            "Solde d'activation",
            "Solde dédié aux activations de packs et services internes.",
            `
            <div class="page-card">
              <div class="kpi-label">Solde d'activation actuel</div>
              <div class="kpi-val" style="margin-top:6px;">${(p.activationBalance || 0).toLocaleString("fr-FR")} FCFA</div>
            </div>
            `
          );
          break;
        case "profil":
          html = renderSubPage(
            "Mon profil",
            "Informations de votre compte Sniper Business Center.",
            state.currentUser ? `
              <div class="page-card">
                <p style="font-size:13.5px;margin-bottom:8px;"><strong>Nom :</strong> ${p.fullName || "Membre SBC"}</p>
                <p style="font-size:13.5px;margin-bottom:8px;"><strong>Email :</strong> ${state.currentUser.email}</p>
                <p style="font-size:13.5px;margin-bottom:8px;"><strong>Pays :</strong> ${p.country || "Bénin"}</p>
                <p style="font-size:13.5px;margin-bottom:14px;"><strong>Code parrain :</strong> ${p.refCode || "-"}</p>
                <button class="btn-secondary" id="logoutBtn">Se déconnecter</button>
              </div>
            ` : `
              <div class="page-card">
                <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">Vous n'êtes pas encore connecté.</p>
                <button class="btn-primary" id="profLoginBtn">Se connecter / S'inscrire</button>
              </div>
            `
          );
          break;
        default:
          html = renderAbonnement();
      }

      appRoot.innerHTML = html;

      document.querySelectorAll(".currency-btn[data-curr]").forEach(btn => {
        btn.addEventListener("click", () => {
          state.currency = btn.dataset.curr;
          render();
        });
      });

      document.querySelectorAll(".pack-select-btn[data-pack]").forEach(btn => {
        btn.addEventListener("click", () => {
          const found = PACKS.find(item => item.id === btn.dataset.pack);
          if (found) openPackModal(found);
        });
      });

      const advBtn = document.getElementById("advertiserBtn");
      if (advBtn) {
        advBtn.addEventListener("click", () => {
          openModal(`
            <h3 style="font-size:18px;font-weight:850;margin-bottom:6px;">Campagne Annonceur</h3>
            <p style="font-size:12.5px;color:var(--muted);margin-bottom:12px;">
              Décrivez votre lien ou produit à diffuser auprès des statuts et de la communauté SBC.
            </p>
            <form id="adCampForm">
              <div class="field">
                <label>Titre de la campagne</label>
                <input type="text" required placeholder="Ex: Boutique Mode Phénix" />
              </div>
              <div class="field">
                <label>Lien ou contact WhatsApp</label>
                <input type="text" required placeholder="https://... ou +229..." />
              </div>
              <button type="submit" class="btn-green">Envoyer la demande</button>
            </form>
          `);
          document.getElementById("adCampForm").addEventListener("submit", (e) => {
            e.preventDefault();
            closeModal();
            showToast("Demande de campagne enregistrée !");
          });
        });
      }

      const homeAuthBtn = document.getElementById("homeAuthBtn");
      if (homeAuthBtn) homeAuthBtn.addEventListener("click", () => openAuthModal("register"));

      const profLoginBtn = document.getElementById("profLoginBtn");
      if (profLoginBtn) profLoginBtn.addEventListener("click", () => openAuthModal("login"));

      const logoutBtn = document.getElementById("logoutBtn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", async () => {
          await signOut(auth);
          showToast("Déconnecté");
        });
      }
    }

    render();
  </script>
</body>
</html>
